# Это проверка работы сабконфигов. Не нужно перезаписывать все дефолтные параметры каждый раз.
components:
  model:
    type: DfineDetecor
    components:
      backbone:
        type: HGNetV2
        params:
          use_lab: false
          return_idx: [1, 2, 3]
          freeze_stem_only: true
          freeze_at: 0
          freeze_norm: true
          pretrained: false

      encoder:
        type: DfineEncoder
        params:
          in_channels: [512, 1024, 2048]
          feat_strides: [8, 16, 32]
          hidden_dim: 256
          nhead: 8
          dim_feedforward: 1024
          dropout: 0.0
          enc_act: "gelu"
          use_encoder_idx: [2]
          num_encoder_layers: 1
          pe_temperature: 10000
          expansion: 1.0
          depth_mult: 1.0
          eval_spatial_size: "${resolution}"

      decoder:
        type: DfineDecoder
        params:
          num_classes: 80
          hidden_dim: 256
          num_queries: 300
          feat_channels: [256, 256, 256]
          feat_strides: [8, 16, 32]
          num_levels: 3
          num_points: [3, 6, 3]
          nhead: 8
          num_layers: 6
          dim_feedforward: 1024
          dropout: 0.0
          activation: "relu"
          num_denoising: 100
          label_noise_ratio: 0.5
          box_noise_scale: 1.0
          learn_query_content: false
          eval_spatial_size: "${resolution}"
          eval_idx: -1
          eps: 0.01
          aux_loss: true
          cross_attn_method: "default"
          query_select_method: "default"
          reg_max: 32
          reg_scale: 4.0
          layer_scale: 1.0

      postprocessor:
        type: DfinePostprocessor
        params:
          use_focal_loss: true
          num_top_queries: 300
